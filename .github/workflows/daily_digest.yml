name: Daily Diglot Weave Digest

on:
  schedule:
    # Запуск 3 раза в день: в 06:00, 11:00, 16:00 UTC (09:00, 14:00, 19:00 по Москве)
    - cron: '0 6,11,16 * * *'
  # Кнопка для ручного запуска в интерфейсе GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process and Publish Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Commit and push queue updates
        run: |
          git config user.name "antondanv"
          git config user.email "antondanilov228@yandex.ru"
          git add queue.json
          git diff --staged --quiet || (git commit -m "Update post queue [skip ci]" && git push) || true
