name: Daily Diglot Weave Digest

on:
  schedule:
    # 09:00, 14:00 and 19:00 Moscow (UTC+3); GitHub may delay scheduled jobs.
    - cron: '0 6,11,16 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Publish one post, check settings, or update the bot profile'
        type: choice
        options: [publish, publish-all, check, profile]
        default: publish

permissions:
  contents: write

concurrency:
  group: tech-diglot-publisher
  cancel-in-progress: false

jobs:
  run-digest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate code
        run: |
          ruff check .
          ruff format --check .
          python -m unittest discover -s tests -v
      - name: Process digest or check settings
        if: inputs.action != 'profile'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCUSSION_CHAT_ID: ${{ secrets.DISCUSSION_CHAT_ID }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GEMINI_SEARCH_MODELS: ${{ vars.GEMINI_SEARCH_MODELS }}
          NEWS_MODE: ${{ vars.NEWS_MODE }}
          DIGEST_ACTION: ${{ inputs.action }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "$DIGEST_ACTION" = check ]; then
            python bot.py --check
          elif [ "$DIGEST_ACTION" = publish-all ]; then
            python bot.py --publish-all
          else
            python bot.py
          fi
      - name: Update bot profile
        if: inputs.action == 'profile'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python configure_bot.py
      - name: Persist queue and publication progress, including failures
        if: always() && inputs.action != 'profile' && inputs.action != 'check'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json
          if [ -f history.json ]; then git add history.json; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update publication state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
